          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var input = JSON.parse(value);
                  
                  // base: X        → RPADDR
                  // ext:  X.1      → LADDR / RADDR
                  var base = {};
                  var ext  = {};
                  
                  for (var i = 0; i < input.length; i++) {
                      var row = input[i];
                      var idx = row["{#SNMPINDEX}"];
                  
                      if (idx.endsWith(".1")) {
                          var clean = idx.slice(0, -2);
                          ext[clean] = row;
                      } else {
                          base[idx] = row;
                      }
                  }
                  
                  var out = [];
                  
                  for (var idx in ext) {
                      var e = ext[idx];
                      var b = base[idx] || {};
                  
                      out.push({
                          "{#SNMPINDEX}": idx,
                  
                          // из базовой записи
                          "{#RPADDR}": b["{#RPADDR}"] || "",
                  
                          // из .1 записи
                          "{#LADDR1}": e["{#LADDR1}"] || "",
                          "{#LADDR2}": e["{#LADDR2}"] || "",
                          "{#RADDR1}": e["{#RADDR1}"] || "",
                          "{#RADDR2}": e["{#RADDR2}"] || ""
                      });
                  }
                  
                  // ❗ если нужно ОСТАВЛЯТЬ X без X.1 — раскомментируй
                  /*
                  for (var idx in base) {
                      if (!ext[idx]) {
                          out.push({
                              "{#SNMPINDEX}": idx,
                              "{#RPADDR}": base[idx]["{#RPADDR}"] || ""
                          });
                      }
                  }
                  */
                  
                  return JSON.stringify(out);
                  
            - type: JAVASCRIPT
              parameters:
                - |
                  function tryParseIPv4(s) {
                      // Убираем пробелы
                      s = s.replace(/\s+/g, '');
                  
                      // Если строка длиной 8 символов HEX
                      if (/^[0-9A-Fa-f]{8}$/.test(s)) {
                          return parseInt(s.substr(0,2),16) + "." +
                                 parseInt(s.substr(2,2),16) + "." +
                                 parseInt(s.substr(4,2),16) + "." +
                                 parseInt(s.substr(6,2),16);
                      }
                  
                      // Если длина 4 → считаем raw bytes
                      if (s.length === 4) {
                          return s.charCodeAt(0) + "." +
                                 s.charCodeAt(1) + "." +
                                 s.charCodeAt(2) + "." +
                                 s.charCodeAt(3);
                      }
                  
                      return null; // не IPv4
                  }
                  
                  function tryParseIPv6(s) {
                      s = s.replace(/\s+/g, '');
                  
                      // 32 hex символа → IPv6
                      if (/^[0-9A-Fa-f]{32}$/.test(s)) {
                          var parts = [];
                          for (var i=0;i<32;i+=4) parts.push(s.substr(i,4));
                          var ip = parts.join(":");
                          ip = ip.replace(/\b(?:0+:){2,}/, ':')
                                 .split(':')
                                 .map(function(o){ return o.replace(/^0+/, '') || '0'; })
                                 .join(':')
                                 .toLowerCase();
                          return ip;
                      }
                  
                      // 16 raw chars → binary IPv6
                      if (s.length === 16) {
                          var parts = [];
                          for (var i=0;i<16;i+=2) {
                              var v = (s.charCodeAt(i)<<8) + s.charCodeAt(i+1);
                              parts.push(v.toString(16));
                          }
                          var ip = parts.join(":");
                          ip = ip.replace(/\b(?:0+:){2,}/, ':')
                                 .split(':')
                                 .map(function(o){ return o.replace(/^0+/, '') || '0'; })
                                 .join(':')
                                 .toLowerCase();
                          return ip;
                      }
                  
                      return null; // не IPv6
                  }
                  
                  // ---- Основной блок ----
                  var json = JSON.parse(value);
                  
                  json.forEach(function(item){
                      for (var key in item) {
                          if (!item.hasOwnProperty(key)) continue;
                  
                          var v = String(item[key]).trim();
                  
                          var ipv4 = tryParseIPv4(v);
                          if (ipv4 !== null) {
                              item[key] = ipv4;
                              continue;
                          }
                  
                          var ipv6 = tryParseIPv6(v);
                          if (ipv6 !== null) {
                              item[key] = ipv6;
                              continue;
                          }
                  
                          // иначе оставляем как есть
                      }
                  });
                  
                  return JSON.stringify(json);
                  
