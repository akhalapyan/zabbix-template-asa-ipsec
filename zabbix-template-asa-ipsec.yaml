zabbix_export:
  version: '6.4'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 6e2cd5e01275491697fb6e075df5107a
      template: 'Cisco ASA IPSec'
      name: 'Cisco ASA IPSec'
      description: |
        IPSec Template For Cisco ASA v1.0
        Tested on Cisco ASA5525 (Software Version 9.12(4)13)
        (compatible with Zabbix 6.4)
        
        by Aram Khalapyan (akhalapyan@telecomarmenia.am)
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 297dc806ee2446a48981cef63c7f2d63
          name: 'Global Active IKE Tunnels'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.171.1.2.1.1.0
          key: cikeGlobalActiveTunnels
          delay: 5m
          tags:
            - tag: Application
              value: IPSec
        - uuid: 5f444a15bb614e9e8f4391bcacc6f7bd
          name: 'Global IKE Tunnels Bits Received'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.9.9.171.1.2.1.3.0
          key: cikeGlobalInOctets
          delay: 5m
          units: bps
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
            - type: MULTIPLIER
              parameters:
                - '8'
          tags:
            - tag: Application
              value: IPSec
        - uuid: 9c0e7c854ba14eb7b0a491431e2f4941
