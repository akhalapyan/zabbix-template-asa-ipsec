              snmp_oid: '1.3.6.1.4.1.9.9.171.1.2.3.1.35.{#SNMPINDEX}'
              key: 'cikeTunStatus[{#RPADDR}]'
              valuemap:
                name: TunnelStatus
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - ''
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              tags:
                - tag: Application
                  value: IPSec
                - tag: Stage
                  value: Phase1
              trigger_prototypes:
                - uuid: ada767a4e61a4d97873a373a119eb9f1
                  expression: 'last(/Cisco ASA IPSec/cikeTunStatus[{#RPADDR}])<>1'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Cisco ASA IPSec/cikeTunStatus[{#RPADDR}])=1'
                  name: 'IKE tunnel to peer {#RPADDR} is {ITEM.LASTVALUE1}'
                  opdata: 'Current status: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  manual_close: 'YES'
            - uuid: 02c3e6cb2f984e4080fa2bbf5456ff51
              name: 'IKE Tunnel Total SA Refreshes (Peer: {#RPADDR})'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.9.9.171.1.2.3.1.18.{#SNMPINDEX}'
